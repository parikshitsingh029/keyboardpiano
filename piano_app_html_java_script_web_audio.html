<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parikshit's Web Piano • JS + Web Audio</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #121931;
      --text: #e9eefb;
      --muted: #9fb0d3;
      --accent: #7aa2ff;
      --whiteKeyEdge: #d8deee;
      --blackKey: #111319;
      --blackKeyTop: #222733;
      --success: #0ecb81;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial;
      background: linear-gradient(180deg, #0b1020 0%, #0f1430 100%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .app {
      width: min(1100px, 95vw);
      background: linear-gradient(180deg, #121931 0%, #0f1530 100%);
      border: 1px solid #2a3557;
      border-radius: 18px;
      box-shadow: 0 10px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
      overflow: hidden;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      border-bottom: 1px solid #202a48;
    }
    h1 { font-size: 18px; margin: 0; letter-spacing: .3px; }
    .muted { color: var(--muted); font-size: 12px; }

    .controls {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 12px;
      padding: 16px 22px;
    }
    .control {
      background: #0e1430;
      border: 1px solid #203058;
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .control label { font-size: 12px; color: var(--muted); }
    .control input[type="range"] { width: 100%; }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    select, button, input[type="checkbox"], input[type="range"] { accent-color: var(--accent); }
    select, button {
      background: #121a3b;
      color: var(--text);
      border: 1px solid #2f3b63;
      border-radius: 10px;
      padding: 8px 10px;
      font: inherit;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .btn-outline { background: transparent; }

    .piano-wrap { position: relative; height: 300px; padding: 18px 22px 26px; }
    .piano {
      position: relative;
      height: 100%;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    .white-keys {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(var(--white-count), 1fr);
    }
    .white-key {
      position: relative;
      border: 1px solid var(--whiteKeyEdge);
      border-bottom-width: 3px;
      background: linear-gradient(#ffffff, #f2f5ff);
      border-radius: 0 0 10px 10px;
      margin: 0 -0.5px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 8px;
      color: #2a3353;
      font-size: 12px;
      letter-spacing: .3px;
      touch-action: none;
      transition: transform .01s linear, background .05s ease;
    }
    .white-key.active {
      background: linear-gradient(#e9f1ff, #cfe1ff);
      transform: translateY(1px);
      border-bottom-width: 2px;
    }

    .black-keys { position: absolute; inset: 0; pointer-events: none; }
    .black-key {
      position: absolute;
      width: var(--black-w);
      height: 58%;
      left: 0;
      top: 0;
      transform: translateX(-50%);
      background: linear-gradient(180deg, var(--blackKeyTop), var(--blackKey));
      border: 1px solid #2a3557;
      border-bottom-width: 3px;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,.55);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 6px;
      color: #d4dbf5;
      font-size: 11px;
      pointer-events: auto;
      touch-action: none;
      transition: transform .01s linear, background .05s ease;
    }
    .black-key.active {
      background: linear-gradient(180deg, #2e3850, #141a28);
      transform: translate(-50%, 1px);
      border-bottom-width: 2px;
    }

    footer {
      padding: 10px 22px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #202a48;
    }
    .kbd-help { font-size: 12px; color: var(--muted); }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border: 1px solid #2a3557;
      background: #111733;
      border-radius: 999px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }
    .dot.off { background: #7b869f; box-shadow: none; }

    .accomp {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 22px 14px;
      border-bottom: 1px solid #202a48;
      flex-wrap: wrap;
    }
    .accomp-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .accomp-toggle, .accomp-field {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .accomp-toggle input { width: 16px; height: 16px; }
    .accomp-field select { padding: 6px 8px; }
    .accomp-field input[type="range"] { width: 90px; }
    .chord-readout {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-height: 28px;
      margin-left: auto;
      text-align: right;
    }
    .chord-readout .chord-name {
      font-size: 22px;
      font-weight: 650;
      letter-spacing: 0.4px;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .chord-readout .chord-meta { font-size: 12px; color: var(--muted); }

    @media (max-width: 820px) {
      .controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .chord-readout { margin-left: 0; text-align: left; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Web Piano <span class="muted">• JavaScript + Web Audio API</span></h1>
      <div class="pill"><span class="dot off" id="audioDot"></span><span class="muted">Audio Context</span></div>
    </header>

    <section class="controls">
      <div class="control">
        <label for="wave">Instrument</label>
        <select id="wave">
          <optgroup label="Instruments">
            <option value="piano" selected>Grand Piano</option>
            <option value="harmonium">Harmonium</option>
            <option value="flute">Flute</option>
            <option value="violin">Violin</option>
            <option value="viola">Viola</option>
            <option value="cello">Cello</option>
          </optgroup>
          <optgroup label="Basic waves">
            <option value="sine">Sine</option>
            <option value="triangle">Triangle</option>
            <option value="sawtooth">Sawtooth</option>
            <option value="square">Square</option>
          </optgroup>
        </select>
      </div>
      <div class="control">
        <label for="volume">Volume</label>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.7" />
      </div>
      <div class="control">
        <label for="octave">Octave (start C)</label>
        <select id="octave">
          <option value="3">C3</option>
          <option value="4" selected>C4 (Middle C)</option>
          <option value="5">C5</option>
        </select>
      </div>
      <div class="control">
        <label>Sustain</label>
        <div class="row"><input id="sustain" type="checkbox" /> <span class="muted">Hold notes after keyup</span></div>
      </div>
      <div class="control">
        <label>Record</label>
        <div class="row">
          <button id="recBtn">● Record</button>
          <button id="stopBtn" disabled>■ Stop</button>
        </div>
      </div>
      <div class="control">
        <label>Playback</label>
        <div class="row">
          <button id="playBtn" disabled>▶ Play</button>
          <button id="stopPlayBtn" class="btn-outline" disabled>■ Stop</button>
          <button id="clearBtn" class="btn-outline" disabled>Clear</button>
        </div>
      </div>
    </section>

    <section class="accomp">
      <div class="accomp-left">
        <label class="accomp-toggle">
          <input id="autoChords" type="checkbox" checked />
          <span>Auto chords</span>
        </label>
        <label class="accomp-field" for="keyLock">
          <span>Key</span>
          <select id="keyLock"></select>
        </label>
        <label class="accomp-field" for="accompSound">
          <span>Sound</span>
          <select id="accompSound">
            <option value="pad" selected>Soft pad</option>
            <option value="bass">Bass guitar</option>
            <option value="tanpura">Tanpura</option>
            <option value="sitar">Sitar</option>
          </select>
        </label>
        <label class="accomp-field" for="accompLevel">
          <span>Level</span>
          <input id="accompLevel" type="range" min="0" max="1" step="0.01" value="0.55" />
        </label>
      </div>
      <div class="chord-readout" id="chordReadout">
        <span class="chord-name" id="chordName">—</span>
        <span class="chord-meta" id="chordMeta">Play a melody to detect key &amp; chords</span>
      </div>
    </section>

    <section class="piano-wrap">
      <div id="piano" class="piano">
        <div class="white-keys" id="whiteKeys" style="--white-count:14"></div>
        <div class="black-keys" id="blackKeys"></div>
      </div>
    </section>

    <footer>
      <div class="kbd-help">Keyboard: <code>z s x d c v g b h n j m , q 2 w 3 e r 5 t 6 y 7</code> (≈ two octaves from selected C)</div>
      <div class="muted">Made with ❤️ using Web Audio</div>
    </footer>
  </div>

  <script>
    const noteNames = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
    const midiToFreq = (midi) => 440 * Math.pow(2, (midi - 69) / 12);
    const midiToName = (midi) => noteNames[midi % 12] + (Math.floor(midi / 12) - 1);

    // Layout-stable codes so Shift doesn't remap digit keys mid-run.
    const KEY_CODES = [
      'KeyZ','KeyS','KeyX','KeyD','KeyC','KeyV','KeyG','KeyB','KeyH','KeyN','KeyJ','KeyM','Comma',
      'KeyQ','Digit2','KeyW','Digit3','KeyE','KeyR','Digit5','KeyT','Digit6','KeyY','Digit7'
    ];

    const whiteKeysEl = document.getElementById('whiteKeys');
    const blackKeysEl = document.getElementById('blackKeys');
    const wave = document.getElementById('wave');
    const volume = document.getElementById('volume');
    const octaveSel = document.getElementById('octave');
    const sustain = document.getElementById('sustain');
    const recBtn = document.getElementById('recBtn');
    const stopBtn = document.getElementById('stopBtn');
    const playBtn = document.getElementById('playBtn');
    const stopPlayBtn = document.getElementById('stopPlayBtn');
    const clearBtn = document.getElementById('clearBtn');
    const audioDotEl = document.getElementById('audioDot');
    const autoChordsEl = document.getElementById('autoChords');
    const keyLockEl = document.getElementById('keyLock');
    const accompSoundEl = document.getElementById('accompSound');
    const accompLevelEl = document.getElementById('accompLevel');
    const chordNameEl = document.getElementById('chordName');
    const chordMetaEl = document.getElementById('chordMeta');

    // ---- Audio engine ----
    // Fast playing fix: releasing voices are NOT kept in currentVoice, and note-on
    // always retriggers (chokes prior voice) instead of silently returning.
    const MAX_VOICES = 32;
    const BASIC_ENV = { attack: 0.004, decay: 0.09, sustain: 0.52, release: 0.18, choke: 0.008, gain: 0.32 };
    const INSTRUMENT_ENV = {
      piano:     { attack: 0.002, decay: 1.1, sustain: 0.12, release: 0.5, choke: 0.02, gain: 0.42 },
      harmonium: { attack: 0.04, decay: 0.1, sustain: 0.92, release: 0.3, choke: 0.015, gain: 0.2 },
      flute:     { attack: 0.05, decay: 0.1, sustain: 0.82, release: 0.22, choke: 0.02, gain: 0.26 },
      violin:    { attack: 0.08, decay: 0.14, sustain: 0.86, release: 0.28, choke: 0.02, gain: 0.2 },
      viola:     { attack: 0.09, decay: 0.16, sustain: 0.86, release: 0.3, choke: 0.022, gain: 0.22 },
      cello:     { attack: 0.1, decay: 0.18, sustain: 0.88, release: 0.34, choke: 0.025, gain: 0.24 },
    };
    const BASIC_WAVES = new Set(['sine', 'triangle', 'sawtooth', 'square']);

    let audioCtx = null;
    let masterGain = null;
    let harmoniumWave = null;
    let stringWave = null;
    let pianoWave = null;
    let tanpuraWave = null;
    let sitarWave = null;
    let bellowsLfo = null;
    let bellowsDepth = null;
    let noiseBuffer = null;
    const currentVoice = new Map(); // midi -> sounding voice for that key
    const liveVoices = new Set();
    const codePressed = new Set();
    const pointerNotes = new Map(); // pointerId -> midi
    let voiceSeq = 0;

    function makeWave(partialFn, n = 24) {
      const real = new Float32Array(n);
      const imag = new Float32Array(n);
      for (let i = 1; i < n; i++) imag[i] = partialFn(i);
      return audioCtx.createPeriodicWave(real, imag, { disableNormalization: false });
    }

    function getHarmoniumWave() {
      if (harmoniumWave) return harmoniumWave;
      // Free-reed spectrum: strong fundamental + odd-heavy partials (nasal/reedy).
      harmoniumWave = makeWave((i) => {
        const oddBoost = (i % 2 === 1) ? 1 : 0.45;
        return (oddBoost / i) * Math.exp(-0.08 * i);
      }, 20);
      return harmoniumWave;
    }

    function getStringWave() {
      if (stringWave) return stringWave;
      // Bowed-string-ish: bright odd/even mix with slower roll-off.
      stringWave = makeWave((i) => (1 / Math.pow(i, 0.9)) * Math.exp(-0.04 * i) * (i % 2 ? 1.05 : 0.8), 26);
      return stringWave;
    }

    function getPianoWave() {
      if (pianoWave) return pianoWave;
      // Hammered-string partials with fairly quick brightness falloff.
      pianoWave = makeWave((i) => (1 / Math.pow(i, 1.15)) * Math.exp(-0.06 * i), 28);
      return pianoWave;
    }

    function getNoiseBuffer() {
      if (noiseBuffer) return noiseBuffer;
      const len = audioCtx.sampleRate * 1.5;
      noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      return noiseBuffer;
    }

    function ensureBellows() {
      getCtx();
      if (bellowsLfo) return;
      // One shared bellows LFO for all harmonium notes (more realistic than per-voice).
      bellowsLfo = audioCtx.createOscillator();
      bellowsDepth = audioCtx.createGain();
      bellowsLfo.type = 'sine';
      bellowsLfo.frequency.value = 4.8;
      bellowsDepth.gain.value = 0.05;
      bellowsLfo.connect(bellowsDepth);
      bellowsLfo.start();
    }

    function getTanpuraWave() {
      if (tanpuraWave) return tanpuraWave;
      // Jawari-like buzz: dense, slightly inharmonic-leaning partial stack.
      const n = 32;
      const real = new Float32Array(n);
      const imag = new Float32Array(n);
      for (let i = 1; i < n; i++) {
        imag[i] = (1 / Math.pow(i, 0.7)) * (i % 2 ? 1 : 0.55) * Math.exp(-0.03 * i);
      }
      imag[1] = 1;
      imag[2] = 0.7;
      imag[3] = 0.85;
      imag[4] = 0.4;
      imag[5] = 0.55;
      tanpuraWave = audioCtx.createPeriodicWave(real, imag, { disableNormalization: false });
      return tanpuraWave;
    }

    function getSitarWave() {
      if (sitarWave) return sitarWave;
      // Bright metallic string-ish spectrum.
      const n = 28;
      const real = new Float32Array(n);
      const imag = new Float32Array(n);
      for (let i = 1; i < n; i++) {
        imag[i] = (1 / i) * Math.exp(-0.045 * i) * (i % 2 ? 1.15 : 0.7);
      }
      imag[1] = 0.9;
      imag[2] = 0.75;
      imag[3] = 0.95;
      imag[6] = 0.45;
      imag[8] = 0.35;
      sitarWave = audioCtx.createPeriodicWave(real, imag, { disableNormalization: false });
      return sitarWave;
    }

    const syncAudioDot = () => {
      audioDotEl.classList.toggle('off', !(audioCtx && audioCtx.state === 'running'));
    };

    const at = (when) => {
      const now = audioCtx.currentTime;
      return when == null ? now : Math.max(when, now);
    };

    const getCtx = () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = parseFloat(volume.value);
        const comp = audioCtx.createDynamicsCompressor();
        comp.threshold.value = -18;
        comp.knee.value = 12;
        comp.ratio.value = 3.5;
        comp.attack.value = 0.002;
        comp.release.value = 0.12;
        masterGain.connect(comp);
        comp.connect(audioCtx.destination);
        audioCtx.addEventListener('statechange', syncAudioDot);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().then(syncAudioDot).catch(syncAudioDot);
      }
      syncAudioDot();
      return audioCtx;
    };

    function stopNodes(v, t) {
      for (const osc of v.oscillators) {
        try { osc.stop(t); } catch (_) {}
      }
    }

    function disposeVoice(v) {
      if (v.dead) return;
      v.dead = true;
      liveVoices.delete(v);
      if (currentVoice.get(v.midi) === v) currentVoice.delete(v.midi);
      for (const node of v.nodes) {
        try { node.disconnect(); } catch (_) {}
      }
    }

    function fadeOut(v, t, seconds, levelHint) {
      if (v.dead || v.releasing) return;
      v.releasing = true;
      v.pedaled = false;
      const g = v.gain.gain;
      const startLevel = Math.max(0.0001, levelHint != null ? levelHint : g.value);
      g.cancelScheduledValues(t);
      g.setValueAtTime(startLevel, t);
      g.exponentialRampToValueAtTime(0.0001, t + seconds);
      stopNodes(v, t + seconds + 0.02);
      const clearMs = Math.max(0, (t + seconds + 0.04 - audioCtx.currentTime) * 1000);
      setTimeout(() => disposeVoice(v), clearMs);
      if (currentVoice.get(v.midi) === v) currentVoice.delete(v.midi);
    }

    function chokeVoice(v, t) {
      // Live retriggers use the instantaneous gain; future (scheduled) chokes use sustain level.
      const level = (t <= audioCtx.currentTime + 0.002) ? undefined : v.sustainLevel;
      fadeOut(v, t, v.choke, level);
    }

    function releaseVoice(v, when) {
      const t = at(when);
      const level = (when == null || when <= audioCtx.currentTime + 0.002)
        ? undefined
        : v.sustainLevel;
      fadeOut(v, t, v.release, level);
    }

    function stealOldest(t) {
      if (liveVoices.size < MAX_VOICES) return;
      let victim = null;
      for (const v of liveVoices) {
        if (v.releasing) { victim = v; break; }
        if (!victim || v.startedAt < victim.startedAt) victim = v;
      }
      if (victim) chokeVoice(victim, t);
    }

    function buildBasicVoice(freq, type, t) {
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();

      osc1.type = type;
      osc2.type = type;
      osc1.frequency.setValueAtTime(freq, t);
      osc2.frequency.setValueAtTime(freq * 1.0035, t);

      filter.type = 'lowpass';
      filter.Q.setValueAtTime(0.4, t);
      filter.frequency.setValueAtTime(7200, t);
      filter.frequency.exponentialRampToValueAtTime(3200, t + 0.08);

      osc1.connect(filter);
      osc2.connect(filter);
      filter.connect(gain);
      gain.connect(masterGain);

      osc1.start(t);
      osc2.start(t);

      return {
        oscillators: [osc1, osc2],
        nodes: [osc1, osc2, filter, gain],
        gain,
      };
    }

    function buildHarmoniumVoice(freq, t) {
      ensureBellows();
      const waveTable = getHarmoniumWave();
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const osc3 = audioCtx.createOscillator(); // soft octave-up reed shimmer
      const band = audioCtx.createBiquadFilter();
      const low = audioCtx.createBiquadFilter();
      const tremolo = audioCtx.createGain();
      const gain = audioCtx.createGain();

      osc1.setPeriodicWave(waveTable);
      osc2.setPeriodicWave(waveTable);
      osc3.type = 'sine';
      osc1.frequency.setValueAtTime(freq, t);
      osc2.frequency.setValueAtTime(freq * 1.006, t); // dual-reed detune
      osc3.frequency.setValueAtTime(freq * 2, t);

      const mix1 = audioCtx.createGain();
      const mix2 = audioCtx.createGain();
      const mix3 = audioCtx.createGain();
      mix1.gain.setValueAtTime(0.72, t);
      mix2.gain.setValueAtTime(0.55, t);
      mix3.gain.setValueAtTime(0.12, t);

      // Nasal reed body: band-pass focus + soft low-pass air.
      band.type = 'bandpass';
      band.frequency.setValueAtTime(Math.min(2800, freq * 3.2), t);
      band.Q.setValueAtTime(1.1, t);
      low.type = 'lowpass';
      low.frequency.setValueAtTime(4200, t);
      low.Q.setValueAtTime(0.5, t);

      // Shared bellows modulates all harmonium notes together.
      tremolo.gain.setValueAtTime(1, t);

      osc1.connect(mix1);
      osc2.connect(mix2);
      osc3.connect(mix3);
      mix1.connect(band);
      mix2.connect(band);
      mix3.connect(low);
      band.connect(low);
      low.connect(tremolo);
      tremolo.connect(gain);
      gain.connect(masterGain);
      bellowsDepth.connect(tremolo.gain);

      osc1.start(t);
      osc2.start(t);
      osc3.start(t);

      return {
        oscillators: [osc1, osc2, osc3],
        nodes: [osc1, osc2, osc3, mix1, mix2, mix3, band, low, tremolo, gain],
        gain,
      };
    }

    function buildFluteVoice(freq, t) {
      const osc = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      const breathFilter = audioCtx.createBiquadFilter();
      const breathGain = audioCtx.createGain();
      const vibrato = audioCtx.createOscillator();
      const vibratoGain = audioCtx.createGain();
      const gain = audioCtx.createGain();
      const noise = audioCtx.createBufferSource();

      osc.type = 'sine';
      osc2.type = 'triangle';
      osc.frequency.setValueAtTime(freq, t);
      osc2.frequency.setValueAtTime(freq, t);
      const mix2 = audioCtx.createGain();
      mix2.gain.value = 0.12;

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(Math.min(2800, freq * 4.5), t);
      filter.Q.setValueAtTime(0.4, t);

      // Soft breath noise.
      noise.buffer = getNoiseBuffer();
      noise.loop = true;
      breathFilter.type = 'bandpass';
      breathFilter.frequency.setValueAtTime(Math.min(2200, freq * 3), t);
      breathFilter.Q.setValueAtTime(0.7, t);
      breathGain.gain.setValueAtTime(0.03, t);

      vibrato.type = 'sine';
      vibrato.frequency.setValueAtTime(5.2, t);
      vibratoGain.gain.setValueAtTime(freq * 0.004, t);
      vibrato.connect(vibratoGain);
      vibratoGain.connect(osc.frequency);

      osc.connect(filter);
      osc2.connect(mix2);
      mix2.connect(filter);
      noise.connect(breathFilter);
      breathFilter.connect(breathGain);
      breathGain.connect(gain);
      filter.connect(gain);
      gain.connect(masterGain);

      osc.start(t);
      osc2.start(t);
      noise.start(t);
      vibrato.start(t);

      return {
        oscillators: [osc, osc2, noise, vibrato],
        nodes: [osc, osc2, mix2, filter, noise, breathFilter, breathGain, vibrato, vibratoGain, gain],
        gain,
      };
    }

    function buildStringVoice(freq, t, kind) {
      // violin: bright/high, viola: warmer mid, cello: dark/low body
      const cfg = {
        violin: { body: 1800, bright: 4200, vibHz: 5.6, vibDepth: 0.0045, detune: 1.004, odd: 0.18 },
        viola:  { body: 1200, bright: 2800, vibHz: 5.2, vibDepth: 0.004, detune: 1.0035, odd: 0.14 },
        cello:  { body: 700, bright: 1800, vibHz: 4.8, vibDepth: 0.0035, detune: 1.003, odd: 0.1 },
      }[kind];

      const waveTable = getStringWave();
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const osc3 = audioCtx.createOscillator();
      const band = audioCtx.createBiquadFilter();
      const low = audioCtx.createBiquadFilter();
      const vibrato = audioCtx.createOscillator();
      const vibratoGain = audioCtx.createGain();
      const gain = audioCtx.createGain();
      const mix1 = audioCtx.createGain();
      const mix2 = audioCtx.createGain();
      const mix3 = audioCtx.createGain();

      osc1.setPeriodicWave(waveTable);
      osc2.setPeriodicWave(waveTable);
      osc3.type = 'sine';
      osc1.frequency.setValueAtTime(freq, t);
      osc2.frequency.setValueAtTime(freq * cfg.detune, t);
      osc3.frequency.setValueAtTime(freq * 2, t);
      mix1.gain.value = 0.7;
      mix2.gain.value = 0.55;
      mix3.gain.value = cfg.odd;

      band.type = 'bandpass';
      band.frequency.setValueAtTime(cfg.body, t);
      band.Q.setValueAtTime(1.0, t);
      low.type = 'lowpass';
      low.frequency.setValueAtTime(cfg.bright, t);
      low.frequency.exponentialRampToValueAtTime(cfg.bright * 0.7, t + 0.25);
      low.Q.setValueAtTime(0.5, t);

      vibrato.type = 'sine';
      vibrato.frequency.setValueAtTime(cfg.vibHz, t);
      vibratoGain.gain.setValueAtTime(0.0001, t);
      // Bow vibrato eases in after the note speaks.
      vibratoGain.gain.linearRampToValueAtTime(freq * cfg.vibDepth, t + 0.22);
      vibrato.connect(vibratoGain);
      vibratoGain.connect(osc1.frequency);
      vibratoGain.connect(osc2.frequency);

      osc1.connect(mix1);
      osc2.connect(mix2);
      osc3.connect(mix3);
      mix1.connect(band);
      mix2.connect(band);
      mix3.connect(low);
      band.connect(low);
      low.connect(gain);
      gain.connect(masterGain);

      osc1.start(t);
      osc2.start(t);
      osc3.start(t);
      vibrato.start(t);

      return {
        oscillators: [osc1, osc2, osc3, vibrato],
        nodes: [osc1, osc2, osc3, mix1, mix2, mix3, band, low, vibrato, vibratoGain, gain],
        gain,
      };
    }

    function buildPianoVoice(freq, t) {
      const waveTable = getPianoWave();
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const osc3 = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      const hammerFilter = audioCtx.createBiquadFilter();
      const hammerGain = audioCtx.createGain();
      const gain = audioCtx.createGain();
      const mix1 = audioCtx.createGain();
      const mix2 = audioCtx.createGain();
      const mix3 = audioCtx.createGain();
      const hammer = audioCtx.createBufferSource();

      osc1.setPeriodicWave(waveTable);
      osc2.setPeriodicWave(waveTable);
      osc3.type = 'sine';
      osc1.frequency.setValueAtTime(freq, t);
      osc2.frequency.setValueAtTime(freq * 1.002, t);
      osc3.frequency.setValueAtTime(freq * 2, t);
      mix1.gain.value = 0.7;
      mix2.gain.value = 0.45;
      mix3.gain.value = 0.16;

      filter.type = 'lowpass';
      // Bright strike then quickly mellows (felt hammer / string decay).
      const bright = Math.min(9000, 1800 + freq * 6);
      filter.frequency.setValueAtTime(bright, t);
      filter.frequency.exponentialRampToValueAtTime(Math.max(600, bright * 0.25), t + 0.9);
      filter.Q.setValueAtTime(0.7, t);

      hammer.buffer = getNoiseBuffer();
      hammerFilter.type = 'bandpass';
      hammerFilter.frequency.setValueAtTime(Math.min(4000, freq * 5), t);
      hammerFilter.Q.setValueAtTime(1.5, t);
      hammerGain.gain.setValueAtTime(0.12, t);
      hammerGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);

      osc1.connect(mix1);
      osc2.connect(mix2);
      osc3.connect(mix3);
      mix1.connect(filter);
      mix2.connect(filter);
      mix3.connect(filter);
      hammer.connect(hammerFilter);
      hammerFilter.connect(hammerGain);
      hammerGain.connect(gain);
      filter.connect(gain);
      gain.connect(masterGain);

      osc1.start(t);
      osc2.start(t);
      osc3.start(t);
      hammer.start(t);
      hammer.stop(t + 0.05);

      return {
        oscillators: [osc1, osc2, osc3, hammer],
        nodes: [osc1, osc2, osc3, mix1, mix2, mix3, filter, hammer, hammerFilter, hammerGain, gain],
        gain,
      };
    }

    function buildInstrumentVoice(instrument, freq, t) {
      if (BASIC_WAVES.has(instrument)) return buildBasicVoice(freq, instrument, t);
      if (instrument === 'harmonium') return buildHarmoniumVoice(freq, t);
      if (instrument === 'flute') return buildFluteVoice(freq, t);
      if (instrument === 'violin' || instrument === 'viola' || instrument === 'cello') {
        return buildStringVoice(freq, t, instrument);
      }
      if (instrument === 'piano') return buildPianoVoice(freq, t);
      return buildBasicVoice(freq, 'triangle', t);
    }

    function voiceOn(midi, velocity = 1, when = null) {
      getCtx();
      const t = at(when);

      const prev = currentVoice.get(midi);
      if (prev && !prev.dead) chokeVoice(prev, t);

      stealOldest(t);

      const freq = midiToFreq(midi);
      const instrument = wave.value;
      const env = INSTRUMENT_ENV[instrument] || BASIC_ENV;
      const built = buildInstrumentVoice(instrument, freq, t);

      const peak = Math.max(0.0001, velocity) * env.gain;
      const sustainLevel = peak * env.sustain;
      built.gain.gain.cancelScheduledValues(t);
      built.gain.gain.setValueAtTime(0.0001, t);
      built.gain.gain.exponentialRampToValueAtTime(peak, t + Math.max(0.001, env.attack));
      built.gain.gain.exponentialRampToValueAtTime(
        Math.max(0.0001, sustainLevel),
        t + env.attack + env.decay
      );

      const v = {
        id: ++voiceSeq,
        midi,
        oscillators: built.oscillators,
        nodes: built.nodes,
        gain: built.gain,
        startedAt: t,
        sustainLevel,
        release: env.release,
        choke: env.choke,
        releasing: false,
        pedaled: false,
        dead: false,
      };
      liveVoices.add(v);
      currentVoice.set(midi, v);
      return v;
    }

    function voiceOff(midi, when = null, { ignoreSustain = false } = {}) {
      if (!audioCtx) return;
      const v = currentVoice.get(midi);
      if (!v || v.dead || v.releasing) return;
      if (!ignoreSustain && sustain.checked) {
        v.pedaled = true;
        return;
      }
      releaseVoice(v, when);
    }

    function midiStillHeld(midi) {
      if ([...pointerNotes.values()].includes(midi)) return true;
      for (const code of codePressed) {
        if (midiForCode(code) === midi) return true;
      }
      return false;
    }

    function flushSustain() {
      if (!audioCtx) return;
      for (const [midi, v] of [...currentVoice]) {
        if (!v.pedaled) continue;
        if (midiStillHeld(midi)) {
          v.pedaled = false;
          continue;
        }
        releaseVoice(v, null);
      }
    }

    function silenceAll() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      for (const v of [...liveVoices]) {
        try {
          v.gain.gain.cancelScheduledValues(now);
          v.gain.gain.setValueAtTime(0.0001, now);
          stopNodes(v, now + 0.02);
        } catch (_) {}
        disposeVoice(v);
      }
      currentVoice.clear();
      liveVoices.clear();
      stopChordPad(0.05);
      document.querySelectorAll('#piano .active').forEach((el) => el.classList.remove('active'));
    }

    // ---- Melody → key/chord accompaniment ----
    const MAJOR_PROFILE = [6.35, 2.23, 3.48, 2.33, 4.38, 4.09, 2.52, 5.19, 2.39, 3.66, 2.29, 2.88];
    const MINOR_PROFILE = [6.33, 2.68, 3.52, 5.38, 2.60, 3.53, 2.54, 4.75, 3.98, 2.69, 3.34, 3.17];
    const MAJOR_DEGREES = [
      { deg: 0, q: 'maj', roman: 'I', w: 1.0 },
      { deg: 2, q: 'min', roman: 'ii', w: 0.72 },
      { deg: 4, q: 'min', roman: 'iii', w: 0.55 },
      { deg: 5, q: 'maj', roman: 'IV', w: 0.9 },
      { deg: 7, q: 'maj', roman: 'V', w: 0.96 },
      { deg: 9, q: 'min', roman: 'vi', w: 0.84 },
      { deg: 11, q: 'dim', roman: 'vii°', w: 0.35 },
    ];
    const MINOR_DEGREES = [
      { deg: 0, q: 'min', roman: 'i', w: 1.0 },
      { deg: 2, q: 'dim', roman: 'ii°', w: 0.4 },
      { deg: 3, q: 'maj', roman: 'III', w: 0.7 },
      { deg: 5, q: 'min', roman: 'iv', w: 0.88 },
      { deg: 7, q: 'min', roman: 'v', w: 0.75 },
      { deg: 7, q: 'maj', roman: 'V', w: 0.92 },
      { deg: 8, q: 'maj', roman: 'VI', w: 0.8 },
      { deg: 10, q: 'maj', roman: 'VII', w: 0.6 },
    ];
    // Common pop/folk movement bonuses (from → to).
    const PROG_MAJOR = {
      I:   { I: 0.12, IV: 0.34, V: 0.38, vi: 0.36, ii: 0.22, iii: 0.1 },
      ii:  { V: 0.42, I: 0.14, IV: 0.12, vi: 0.1 },
      iii: { vi: 0.28, IV: 0.22, I: 0.12 },
      IV:  { I: 0.32, V: 0.34, ii: 0.18, vi: 0.16 },
      V:   { I: 0.46, vi: 0.28, IV: 0.14 },
      vi:  { IV: 0.34, V: 0.28, ii: 0.22, I: 0.16 },
      'vii°': { I: 0.3, V: 0.18 },
    };
    const PROG_MINOR = {
      i:   { i: 0.12, iv: 0.32, V: 0.4, VI: 0.3, III: 0.18, VII: 0.16 },
      'ii°': { V: 0.36, i: 0.14 },
      III: { VI: 0.24, iv: 0.18, i: 0.12 },
      iv:  { i: 0.3, V: 0.34, VII: 0.14 },
      v:   { i: 0.28, VI: 0.16 },
      V:   { i: 0.48, VI: 0.22 },
      VI:  { III: 0.2, iv: 0.26, V: 0.24, i: 0.14 },
      VII: { III: 0.22, i: 0.2, V: 0.16 },
    };
    const QUALITY_INTERVALS = { maj: [0, 4, 7], min: [0, 3, 7], dim: [0, 3, 6] };
    const QUALITY_SUFFIX = { maj: '', min: 'm', dim: 'dim' };
    const GRACE_MS = 85;

    const melodyHistory = []; // { pc, t, dur }
    const pendingMelody = new Map(); // midi -> { token, started }
    let melodyToken = 0;
    let detectedKey = { tonic: 0, mode: 'major', label: 'C major', locked: false };
    let currentChord = null;
    let lastChordChangeAt = 0;
    let accompIdleTimer = 0;
    const chordPad = { voices: [], label: null, midis: [], style: null };

    (function populateKeyLock() {
      const optAuto = document.createElement('option');
      optAuto.value = 'auto';
      optAuto.textContent = 'Auto detect';
      keyLockEl.appendChild(optAuto);
      for (const mode of ['major', 'minor']) {
        for (let t = 0; t < 12; t++) {
          const opt = document.createElement('option');
          opt.value = `${t}:${mode}`;
          opt.textContent = `${noteNames[t]} ${mode}`;
          keyLockEl.appendChild(opt);
        }
      }
    })();

    function triadPcs(rootPc, quality) {
      return QUALITY_INTERVALS[quality].map((i) => (rootPc + i) % 12);
    }

    function correlate(hist, profile, offset) {
      let sum = 0;
      for (let i = 0; i < 12; i++) sum += hist[i] * profile[(i - offset + 12) % 12];
      return sum;
    }

    function keyFromLock() {
      const v = keyLockEl.value;
      if (!v || v === 'auto') return null;
      const [t, mode] = v.split(':');
      const tonic = parseInt(t, 10);
      return { tonic, mode, label: `${noteNames[tonic]} ${mode}`, locked: true };
    }

    function detectKey(history) {
      const locked = keyFromLock();
      if (locked) return locked;

      const hist = new Array(12).fill(0);
      const now = performance.now();
      for (const n of history) {
        const age = Math.max(0, now - n.t);
        const durBoost = 0.65 + Math.min(1.8, (n.dur || 180) / 260);
        hist[n.pc] += Math.exp(-age / 3500) * durBoost;
      }
      let best = { tonic: 0, mode: 'major', score: -Infinity };
      for (let tonic = 0; tonic < 12; tonic++) {
        const maj = correlate(hist, MAJOR_PROFILE, tonic);
        const min = correlate(hist, MINOR_PROFILE, tonic);
        if (maj > best.score) best = { tonic, mode: 'major', score: maj };
        if (min > best.score) best = { tonic, mode: 'minor', score: min };
      }
      return { tonic: best.tonic, mode: best.mode, label: `${noteNames[best.tonic]} ${best.mode}`, locked: false };
    }

    function chordLabel(rootPc, quality, roman) {
      return {
        rootPc,
        quality,
        roman,
        pcs: triadPcs(rootPc, quality),
        name: `${noteNames[rootPc]}${QUALITY_SUFFIX[quality]}`,
        label: `${noteNames[rootPc]}${QUALITY_SUFFIX[quality]}|${roman}`,
      };
    }

    function chooseChord(key, melodyPc, prev) {
      const degrees = key.mode === 'major' ? MAJOR_DEGREES : MINOR_DEGREES;
      const prog = key.mode === 'major' ? PROG_MAJOR : PROG_MINOR;
      const candidates = [];
      for (const d of degrees) {
        const root = (key.tonic + d.deg) % 12;
        const chord = chordLabel(root, d.q, d.roman);
        const contains = chord.pcs.includes(melodyPc);
        let score = d.w;
        if (contains) score += 1.05;
        else score -= 0.9;
        if (chord.pcs[0] === melodyPc) score += 0.18;
        if (chord.pcs[2] === melodyPc) score += 0.08; // fifth in melody
        if (prev && prev.label === chord.label) score += 0.28;
        if (prev && prog[prev.roman] && prog[prev.roman][chord.roman] != null) {
          score += prog[prev.roman][chord.roman];
        }
        if (d.roman === 'I' || d.roman === 'i') score += 0.04;
        candidates.push({ chord, score, contains });
      }
      candidates.sort((a, b) => b.score - a.score);
      return (candidates.find((c) => c.contains) || candidates[0]).chord;
    }

    function voiceLeadMidis(chord, prevMidis) {
      let root = 48 + chord.rootPc;
      while (root > 55) root -= 12;
      while (root < 47) root += 12;
      const ideal = QUALITY_INTERVALS[chord.quality].map((iv, idx) => {
        let m = root + iv;
        if (idx > 0 && m > root + 8) m -= 12;
        return m;
      });

      let upper;
      if (!prevMidis || prevMidis.length === 0) {
        upper = ideal;
      } else {
        const prevUpper = prevMidis.filter((m) => m >= 45);
        upper = ideal.map((m) => {
          let best = m;
          let bestDist = Infinity;
          for (const cand of [m - 12, m, m + 12]) {
            if (cand < 42 || cand > 65) continue;
            const dist = Math.min(...prevUpper.map((p) => Math.abs(p - cand)));
            if (dist < bestDist) {
              bestDist = dist;
              best = cand;
            }
          }
          return best;
        });
      }
      upper = [...new Set(upper)].sort((a, b) => a - b);
      const bass = upper[0] - 12;
      return [...upper, bass];
    }

    function updateChordReadout(key, chord) {
      const lockTag = key?.locked ? ' · locked' : '';
      if (!chord) {
        chordNameEl.textContent = '—';
        chordMetaEl.textContent = key
          ? `Key: ${key.label}${lockTag} · listening…`
          : 'Play a melody to detect key & chords';
        return;
      }
      chordNameEl.textContent = `${chord.name}  (${chord.roman})`;
      chordMetaEl.textContent = `Key: ${key.label}${lockTag}`;
    }

    function stopChordPad(releaseSec = 0.4) {
      if (!audioCtx || chordPad.voices.length === 0) {
        chordPad.voices = [];
        chordPad.label = null;
        chordPad.style = null;
        return;
      }
      const now = audioCtx.currentTime;
      for (const v of chordPad.voices) {
        try {
          v.gain.gain.cancelScheduledValues(now);
          v.gain.gain.setValueAtTime(Math.max(0.0001, v.gain.gain.value), now);
          v.gain.gain.exponentialRampToValueAtTime(0.0001, now + releaseSec);
          for (const osc of v.oscillators) osc.stop(now + releaseSec + 0.03);
        } catch (_) {}
        setTimeout(() => {
          for (const node of v.nodes) {
            try { node.disconnect(); } catch (_) {}
          }
        }, (releaseSec + 0.05) * 1000);
      }
      chordPad.voices = [];
      chordPad.label = null;
      chordPad.style = null;
    }

    function accompStyle() {
      return accompSoundEl.value || 'pad';
    }

    function padLevelFor(index, count, style, accomp) {
      const isBass = index === count - 1;
      if (style === 'bass') return (isBass ? 0.16 : 0.07) * accomp;
      if (style === 'tanpura') return (isBass ? 0.09 : 0.11) * accomp;
      if (style === 'sitar') return (isBass ? 0.05 : 0.09) * accomp;
      // soft pad / reed blend
      const reed = wave.value === 'harmonium';
      return (isBass ? 0.05 : 0.078) * accomp * (reed ? 0.85 : 1);
    }

    function createPadVoice(midi, now, level, style, voiceIndex = 0) {
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();
      const oscillators = [];
      const nodes = [filter, gain];
      const freq = midiToFreq(midi);

      if (style === 'bass') {
        const osc = audioCtx.createOscillator();
        const oscSub = audioCtx.createOscillator();
        osc.type = 'sawtooth';
        oscSub.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        oscSub.frequency.setValueAtTime(freq * 0.5, now);
        const mix = audioCtx.createGain();
        mix.gain.value = 0.55;
        const subMix = audioCtx.createGain();
        subMix.gain.value = 0.4;
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(520, now);
        filter.frequency.exponentialRampToValueAtTime(220, now + 0.18);
        filter.Q.setValueAtTime(1.2, now);
        osc.connect(mix);
        oscSub.connect(subMix);
        mix.connect(filter);
        subMix.connect(filter);
        filter.connect(gain);
        // Plucky bass envelope.
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, level), now + 0.012);
        gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, level * 0.45), now + 0.22);
        osc.start(now);
        oscSub.start(now);
        oscillators.push(osc, oscSub);
        nodes.push(osc, oscSub, mix, subMix);
      } else if (style === 'tanpura') {
        const waveTable = getTanpuraWave();
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        osc1.setPeriodicWave(waveTable);
        osc2.setPeriodicWave(waveTable);
        osc1.frequency.setValueAtTime(freq, now);
        osc2.frequency.setValueAtTime(freq * 1.0025, now);
        const mix = audioCtx.createGain();
        mix.gain.value = 0.65;
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(Math.min(2400, freq * 3.5), now);
        filter.Q.setValueAtTime(1.4, now);
        const shimmer = audioCtx.createGain();
        shimmer.gain.value = 1;
        const lfo = audioCtx.createOscillator();
        const lfoGain = audioCtx.createGain();
        lfo.type = 'sine';
        lfo.frequency.value = 0.35 + voiceIndex * 0.07; // slow cyclic jawari feel
        lfoGain.gain.value = 0.07;
        osc1.connect(mix);
        osc2.connect(mix);
        mix.connect(filter);
        filter.connect(shimmer);
        shimmer.connect(gain);
        lfo.connect(lfoGain);
        lfoGain.connect(shimmer.gain);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, level), now + 0.25);
        osc1.start(now);
        osc2.start(now);
        lfo.start(now);
        oscillators.push(osc1, osc2, lfo);
        nodes.push(osc1, osc2, mix, shimmer, lfo, lfoGain);
      } else if (style === 'sitar') {
        const waveTable = getSitarWave();
        const osc = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        osc.setPeriodicWave(waveTable);
        osc2.type = 'triangle';
        const stagger = voiceIndex * 0.03;
        const t0 = now + stagger;
        osc.frequency.setValueAtTime(freq * 1.01, t0);
        osc.frequency.exponentialRampToValueAtTime(freq, t0 + 0.05);
        osc2.frequency.setValueAtTime(freq * 2, t0);
        const mix = audioCtx.createGain();
        const mix2 = audioCtx.createGain();
        mix.gain.value = 0.7;
        mix2.gain.value = 0.12;
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1800, t0);
        filter.frequency.exponentialRampToValueAtTime(900, t0 + 0.35);
        filter.Q.setValueAtTime(2.2, t0);
        // Soft pluck noise.
        const noiseDur = 0.04;
        const noiseBuf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * noiseDur), audioCtx.sampleRate);
        const data = noiseBuf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
        const noise = audioCtx.createBufferSource();
        const noiseGain = audioCtx.createGain();
        const noiseFilter = audioCtx.createBiquadFilter();
        noise.buffer = noiseBuf;
        noiseFilter.type = 'highpass';
        noiseFilter.frequency.value = 1200;
        noiseGain.gain.setValueAtTime(level * 0.35, t0);
        noiseGain.gain.exponentialRampToValueAtTime(0.0001, t0 + noiseDur);
        osc.connect(mix);
        osc2.connect(mix2);
        mix.connect(filter);
        mix2.connect(filter);
        filter.connect(gain);
        noise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(gain);
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, level), t0 + 0.01);
        gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, level * 0.35), t0 + 0.5);
        osc.start(t0);
        osc2.start(t0);
        noise.start(t0);
        oscillators.push(osc, osc2, noise);
        nodes.push(osc, osc2, mix, mix2, noise, noiseGain, noiseFilter);
      } else if (style === 'pad' && wave.value === 'harmonium') {
        ensureBellows();
        const waveTable = getHarmoniumWave();
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        osc1.setPeriodicWave(waveTable);
        osc2.setPeriodicWave(waveTable);
        osc1.frequency.setValueAtTime(freq, now);
        osc2.frequency.setValueAtTime(freq * 1.004, now);
        const mix = audioCtx.createGain();
        mix.gain.value = 0.7;
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(Math.min(2200, freq * 2.8), now);
        filter.Q.setValueAtTime(0.9, now);
        const trem = audioCtx.createGain();
        trem.gain.value = 1;
        osc1.connect(mix);
        osc2.connect(mix);
        mix.connect(filter);
        filter.connect(trem);
        trem.connect(gain);
        bellowsDepth.connect(trem.gain);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, level), now + 0.06);
        osc1.start(now);
        osc2.start(now);
        oscillators.push(osc1, osc2);
        nodes.push(osc1, osc2, mix, trem);
      } else {
        const osc = audioCtx.createOscillator();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1600, now);
        filter.Q.setValueAtTime(0.3, now);
        osc.connect(filter);
        filter.connect(gain);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, level), now + 0.06);
        osc.start(now);
        oscillators.push(osc);
        nodes.push(osc);
      }

      gain.connect(masterGain);
      return { oscillators, nodes, gain };
    }

    function tanpuraMidis(key) {
      // Classic Sa–Pa–Sa drone from the detected/locked key (not every chord).
      let sa = 45 + ((key.tonic - (45 % 12) + 12) % 12); // around F2–E3
      while (sa < 43) sa += 12;
      while (sa > 52) sa -= 12;
      const pa = sa + 7;
      const saHi = sa + 12;
      return [sa, pa, saHi, sa - 12];
    }

    function bassMidis(chord) {
      let root = 36 + chord.rootPc; // C2 + pc
      while (root < 36) root += 12;
      while (root > 48) root -= 12;
      return [root + 7, root]; // fifth + root (root last = "bass" slot for leveling)
    }

    function startChordPad(chord, force = false) {
      getCtx();
      const style = accompStyle();
      const styleKey = `${style}:${wave.value === 'harmonium' ? 'h' : 'x'}`;
      // Tanpura follows key; other styles follow chord label.
      const identity = style === 'tanpura'
        ? `tanpura:${detectedKey.tonic}:${detectedKey.mode}`
        : chord.label;

      if (!force && chordPad.label === identity && chordPad.style === styleKey) return;
      const prevMidis = chordPad.midis.slice();
      stopChordPad(style === 'tanpura' ? 0.45 : 0.2);

      const now = audioCtx.currentTime;
      let midis;
      if (style === 'tanpura') midis = tanpuraMidis(detectedKey);
      else if (style === 'bass') midis = bassMidis(chord);
      else midis = voiceLeadMidis(chord, prevMidis);

      const accomp = parseFloat(accompLevelEl.value);
      const voices = midis.map((midi, i) => {
        const level = padLevelFor(i, midis.length, style, accomp);
        return createPadVoice(midi, now, level, style, i);
      });

      chordPad.voices = voices;
      chordPad.label = identity;
      chordPad.midis = midis;
      chordPad.style = styleKey;
    }

    function onMelodyNote(midi, durMs = 180) {
      if (!autoChordsEl.checked) return;

      const now = performance.now();
      melodyHistory.push({
        pc: ((midi % 12) + 12) % 12,
        t: now,
        dur: Math.max(GRACE_MS, durMs),
      });
      while (melodyHistory.length && now - melodyHistory[0].t > 10000) melodyHistory.shift();
      if (melodyHistory.length > 64) melodyHistory.splice(0, melodyHistory.length - 64);

      detectedKey = detectKey(melodyHistory);
      const melodyPc = ((midi % 12) + 12) % 12;
      let next = chooseChord(detectedKey, melodyPc, currentChord);

      if (
        currentChord &&
        currentChord.pcs.includes(melodyPc) &&
        next.label !== currentChord.label &&
        now - lastChordChangeAt < 480
      ) {
        next = currentChord;
      }

      if (!currentChord || next.label !== currentChord.label) {
        currentChord = next;
        lastChordChangeAt = now;
      }
      const tanpuraId = `tanpura:${detectedKey.tonic}:${detectedKey.mode}`;
      const padStale = !chordPad.label
        || (accompStyle() === 'tanpura' ? chordPad.label !== tanpuraId : chordPad.label !== currentChord.label);
      if (padStale) startChordPad(currentChord);

      updateChordReadout(detectedKey, currentChord);

      clearTimeout(accompIdleTimer);
      const idleMs = accompStyle() === 'tanpura' ? 5200 : 3000;
      accompIdleTimer = setTimeout(() => {
        stopChordPad(accompStyle() === 'tanpura' ? 1.0 : 0.65);
        chordPad.midis = [];
        updateChordReadout(detectedKey, null);
      }, idleMs);
    }

    function queueMelodyHarmony(midi) {
      if (!autoChordsEl.checked) return;
      const token = ++melodyToken;
      const started = performance.now();
      pendingMelody.set(midi, { token, started });
      setTimeout(() => {
        const p = pendingMelody.get(midi);
        if (!p || p.token !== token) return; // grace note released early
        const dur = performance.now() - p.started;
        onMelodyNote(midi, dur);
      }, GRACE_MS);
    }

    function cancelMelodyHarmony(midi) {
      pendingMelody.delete(midi);
    }

    autoChordsEl.addEventListener('change', () => {
      if (!autoChordsEl.checked) {
        clearTimeout(accompIdleTimer);
        pendingMelody.clear();
        stopChordPad(0.3);
        chordPad.midis = [];
        currentChord = null;
        updateChordReadout(detectedKey, null);
        chordMetaEl.textContent = 'Auto chords off';
      } else {
        chordMetaEl.textContent = 'Play a melody to detect key & chords';
      }
    });

    keyLockEl.addEventListener('change', () => {
      detectedKey = detectKey(melodyHistory);
      updateChordReadout(detectedKey, currentChord);
      if (currentChord && autoChordsEl.checked) {
        // Re-pick under locked/unlocked key using last melody pc if available.
        const last = melodyHistory[melodyHistory.length - 1];
        if (last) {
          currentChord = chooseChord(detectedKey, last.pc, currentChord);
          lastChordChangeAt = performance.now();
          startChordPad(currentChord, true);
          updateChordReadout(detectedKey, currentChord);
        }
      }
    });

    accompLevelEl.addEventListener('input', () => {
      if (!audioCtx || !chordPad.voices.length) return;
      const accomp = parseFloat(accompLevelEl.value);
      const style = accompStyle();
      const now = audioCtx.currentTime;
      chordPad.voices.forEach((v, i) => {
        const level = padLevelFor(i, chordPad.voices.length, style, accomp);
        v.gain.gain.cancelScheduledValues(now);
        v.gain.gain.setTargetAtTime(Math.max(0.0001, level), now, 0.03);
      });
    });

    function refreshAccompPad() {
      if (currentChord && autoChordsEl.checked) startChordPad(currentChord, true);
    }

    wave.addEventListener('change', refreshAccompPad);
    accompSoundEl.addEventListener('change', refreshAccompPad);

    // ---- Keyboard UI ----
    let startC = 60;
    const keyEls = new Map();

    function keyLabelForMidi(midi) {
      const idx = midi - startC;
      if (idx < 0 || idx >= KEY_CODES.length) return null;
      const code = KEY_CODES[idx];
      if (code === 'Comma') return ',';
      return code.replace(/^Key/, '').replace(/^Digit/, '').toLowerCase();
    }

    function midiForCode(code) {
      const idx = KEY_CODES.indexOf(code);
      return idx === -1 ? null : startC + idx;
    }

    function highlightKey(midi, on) {
      const el = keyEls.get(midi);
      if (!el) return;
      el.classList.toggle('active', on);
    }

    function syncHighlight(midi) {
      highlightKey(midi, midiStillHeld(midi));
    }

    function buildKeyboard() {
      whiteKeysEl.style.setProperty('--white-count', 14);
      whiteKeysEl.innerHTML = '';
      blackKeysEl.innerHTML = '';
      keyEls.clear();

      const whitePattern = [0, 2, 4, 5, 7, 9, 11];
      const blackAfterWhiteIdx = [0, 1, 3, 4, 5];
      const totalWhite = 14;
      const whiteWidthPct = 100 / totalWhite;
      blackKeysEl.style.setProperty('--black-w', (whiteWidthPct * 0.6) + '%');

      for (let w = 0; w < totalWhite; w++) {
        const octaveOffset = Math.floor(w / 7);
        const idxInOct = w % 7;
        const midi = startC + octaveOffset * 12 + whitePattern[idxInOct];

        const k = document.createElement('div');
        k.className = 'white-key';
        k.dataset.midi = String(midi);
        k.title = `${midiToName(midi)}\nKey: ${keyLabelForMidi(midi) ?? '—'}`;
        k.innerHTML = `<span>${midiToName(midi)}</span>`;
        attachKeyPointer(k, midi);
        whiteKeysEl.appendChild(k);
        keyEls.set(midi, k);

        if (blackAfterWhiteIdx.includes(idxInOct)) {
          const blackMidi = midi + 1;
          const b = document.createElement('div');
          b.className = 'black-key';
          b.dataset.midi = String(blackMidi);
          b.title = `${midiToName(blackMidi)}\nKey: ${keyLabelForMidi(blackMidi) ?? '—'}`;
          b.innerHTML = `<span>${midiToName(blackMidi)}</span>`;
          b.style.left = ((w + 1) * whiteWidthPct) + '%';
          attachKeyPointer(b, blackMidi);
          blackKeysEl.appendChild(b);
          keyEls.set(blackMidi, b);
        }
      }
    }

    function pressMidi(midi) {
      highlightKey(midi, true);
      voiceOn(midi, 1);
      addToRecording('on', midi);
      queueMelodyHarmony(midi);
    }

    function releaseMidi(midi) {
      syncHighlight(midi);
      if (midiStillHeld(midi)) return;
      // Drop grace notes before they can flip the harmony.
      const pending = pendingMelody.get(midi);
      if (pending && performance.now() - pending.started < GRACE_MS) {
        cancelMelodyHarmony(midi);
      }
      voiceOff(midi);
      addToRecording('off', midi);
    }

    function attachKeyPointer(el, midi) {
      el.addEventListener('pointerdown', (e) => {
        if (e.button != null && e.button !== 0) return;
        e.preventDefault();
        getCtx();
        if (pointerNotes.has(e.pointerId)) return;
        el.setPointerCapture?.(e.pointerId);
        pointerNotes.set(e.pointerId, midi);
        pressMidi(midi);
      });

      const endPointer = (e) => {
        const heldMidi = pointerNotes.get(e.pointerId);
        if (heldMidi == null) return;
        pointerNotes.delete(e.pointerId);
        releaseMidi(heldMidi);
      };

      el.addEventListener('pointerup', endPointer);
      el.addEventListener('pointercancel', endPointer);
      el.addEventListener('lostpointercapture', endPointer);
      // No pointerleave — it was cutting notes during fast taps/jitters.
    }

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      if (!KEY_CODES.includes(e.code)) return;
      if (codePressed.has(e.code)) return;
      e.preventDefault();
      getCtx();
      codePressed.add(e.code);
      const midi = midiForCode(e.code);
      if (midi == null) return;
      pressMidi(midi);
    });

    window.addEventListener('keyup', (e) => {
      if (!codePressed.has(e.code)) return;
      codePressed.delete(e.code);
      const midi = midiForCode(e.code);
      if (midi == null) return;
      releaseMidi(midi);
    });

    window.addEventListener('blur', () => {
      for (const code of [...codePressed]) {
        codePressed.delete(code);
        const midi = midiForCode(code);
        if (midi != null) releaseMidi(midi);
      }
      for (const [pointerId, midi] of [...pointerNotes]) {
        pointerNotes.delete(pointerId);
        releaseMidi(midi);
      }
    });

    volume.addEventListener('input', () => {
      if (!audioCtx) return;
      masterGain.gain.value = parseFloat(volume.value);
    });

    octaveSel.addEventListener('change', () => {
      const baseOct = parseInt(octaveSel.value, 10);
      startC = 12 * (baseOct + 1);
      // Drop in-flight input ownership tied to old layout.
      codePressed.clear();
      pointerNotes.clear();
      silenceAll();
      buildKeyboard();
    });

    sustain.addEventListener('change', () => {
      if (!sustain.checked) flushSustain();
    });

    // ---- Recording / playback ----
    let recording = [];
    let isRecording = false;
    let recStart = 0;
    const playback = { token: 0, timer: 0, playing: false, highlights: [] };

    function addToRecording(type, midi) {
      if (!isRecording) return;
      recording.push({ type, midi, t: performance.now() - recStart });
    }

    function syncTransportUI() {
      const hasTake = recording.length > 0;
      recBtn.disabled = isRecording || playback.playing;
      stopBtn.disabled = !isRecording;
      playBtn.disabled = isRecording || playback.playing || !hasTake;
      stopPlayBtn.disabled = !playback.playing;
      clearBtn.disabled = isRecording || playback.playing || !hasTake;
      playBtn.textContent = playback.playing ? '▶ Playing…' : '▶ Play';
    }

    function setRecUI(rec) {
      isRecording = rec;
      syncTransportUI();
    }

    function clearPlaybackHighlights() {
      for (const id of playback.highlights) clearTimeout(id);
      playback.highlights = [];
    }

    function stopPlayback() {
      playback.token++;
      if (playback.timer) {
        clearTimeout(playback.timer);
        playback.timer = 0;
      }
      clearPlaybackHighlights();
      const wasPlaying = playback.playing;
      playback.playing = false;
      if (wasPlaying) silenceAll();
      syncTransportUI();
    }

    function startPlayback() {
      if (recording.length === 0 || isRecording) return;
      stopPlayback();
      getCtx();

      const token = playback.token;
      playback.playing = true;
      syncTransportUI();

      // Lookahead scheduler on the audio clock — stays accurate for fast passages.
      const events = recording.map((e) => ({ ...e }));
      const base = events[0].t;
      const startAt = audioCtx.currentTime + 0.04;
      const horizon = 0.12;
      let index = 0;

      const queueHighlight = (midi, on, when) => {
        const delay = Math.max(0, (when - audioCtx.currentTime) * 1000);
        const id = setTimeout(() => {
          if (token !== playback.token) return;
          highlightKey(midi, on);
        }, delay);
        playback.highlights.push(id);
      };

      const tick = () => {
        if (token !== playback.token) return;
        const now = audioCtx.currentTime;
        while (index < events.length) {
          const ev = events[index];
          const when = startAt + (ev.t - base) / 1000;
          if (when > now + horizon) break;
          if (ev.type === 'on') {
            voiceOn(ev.midi, 1, when);
            queueHighlight(ev.midi, true, when);
            queueMelodyHarmony(ev.midi);
          } else {
            voiceOff(ev.midi, when, { ignoreSustain: true });
            queueHighlight(ev.midi, false, when);
            const pending = pendingMelody.get(ev.midi);
            if (pending && performance.now() - pending.started < GRACE_MS) {
              cancelMelodyHarmony(ev.midi);
            }
          }
          index++;
        }

        if (index < events.length) {
          playback.timer = setTimeout(tick, 20);
        } else {
          const lastWhen = startAt + (events[events.length - 1].t - base) / 1000;
          const endDelay = Math.max(0, (lastWhen - audioCtx.currentTime) * 1000) + 450;
          playback.timer = setTimeout(() => {
            if (token !== playback.token) return;
            playback.playing = false;
            syncTransportUI();
          }, endDelay);
        }
      };

      tick();
    }

    recBtn.addEventListener('click', () => {
      stopPlayback();
      getCtx();
      recording = [];
      recStart = performance.now();
      setRecUI(true);
    });
    stopBtn.addEventListener('click', () => setRecUI(false));
    playBtn.addEventListener('click', () => startPlayback());
    stopPlayBtn.addEventListener('click', () => stopPlayback());
    clearBtn.addEventListener('click', () => {
      stopPlayback();
      recording = [];
      syncTransportUI();
    });

    buildKeyboard();
    syncTransportUI();
  </script>
</body>
</html>
